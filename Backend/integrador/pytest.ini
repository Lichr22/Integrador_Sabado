[pytest]
testpaths = src/test/python
# Resultados: target/python-reports/pytest.html
# Cobertura:  target/python-reports/coverage/index.html
addopts =
    --cov=src/main/resources
    --cov-report=term
    --cov-report=html:target/python-reports/coverage
    --html=target/python-reports/pytest.html
    --self-contained-html
