[pytest]
testpaths = tests
# Resultados: reportes-pruebas/pytest.html (y junit.xml para actualizar la matriz)
# Cobertura:  reportes-pruebas/cobertura/index.html
addopts =
    --cov=src
    --cov-report=term
    --cov-report=html:reportes-pruebas/cobertura
    --html=reportes-pruebas/pytest.html
    --self-contained-html
    --junitxml=reportes-pruebas/junit.xml
    -rs
